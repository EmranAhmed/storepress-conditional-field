name: Github Release

on:
    push:
        # Sequence of patterns matched against refs/tags
        tags:
            - '**' # Push events to matching  i.e. 1.0, 20.15.10, including hierarchical tags like v1.0/beta
            # Semver (https://semver.org/) release pattern.
            # - '[0-9]+.[0-9]+.[0-9]+*'

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions: write-all

env:
    REPOSITORY_NAME: ${{ github.event.repository.name }}

jobs:

    # Build distribution release.
    #
    # Performs the following steps:
    # - Checks out the repository.
    # - Set up PHP.
    # - Install PHP Dependencies.
    # - Setup and Install Node.js.
    # - Make Zip.
    # - Upload Release.

    build:
        name: Release
        runs-on: ubuntu-latest
        steps:
            -   name: "Checks out the repository"
                uses: actions/checkout@v6

            -   name: "Setup and Install Node.js"
                uses: actions/setup-node@v6
                with:
                    node-version: '24.x'
                    cache: 'npm'

            -   name: "Install and ZIP"
                run: npm install && npm run plugin-zip --if-present

            -   name: "Get release version."
                run: echo "RELEASE_TAG=$(node -p -e "require('./package.json').version")" >> $GITHUB_ENV

            -   name: "Get release file base name."
                run: echo "RELEASE_NAME=$(node -p -e "require('./package.json').name.replace(/^@/, '').replace('/', '-')")" >> $GITHUB_ENV

            -   name: "Upload Release"
                uses: softprops/action-gh-release@v3
                with:
                    name: Release - v${{ env.RELEASE_TAG }}
                    tag_name: ${{ env.RELEASE_TAG }}
                    files: ./${{ env.RELEASE_NAME }}-v${{ env.RELEASE_TAG }}.zip
                    make_latest: true
                    overwrite_files: true
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
